name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# bash with pipefail, so a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash

jobs:
  selftest:
    name: Selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Verify amalgamation
        if: runner.os != 'Windows'
        run: |
          python3 tools/amalgamate.py --check
          cc -O2 -std=c11 -Wall -Wextra -pedantic -Werror -I. src/jb.c -lm -o jb-modular
          ./jb-modular --selftest

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test
        if: runner.os != 'Windows'
        run: |
          cc -O2 -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 jb.c -lm -o jb
          ./jb --selftest | tee selftest.json

      # ARM runners select the NEON backend, whose strict selftest also checks
      # bit-identity with the reference; -DJB_SCALAR builds that reference.
      # Fast math switches NEON to fused multiply-adds, so test it too.
      - name: NEON backend and reference build
        if: runner.arch == 'ARM64'
        run: |
          grep -q '"kernels":"neon"' selftest.json
          cc -O2 -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror -ffast-math jb.c -lm -o jb-fast
          ./jb-fast --selftest | tee fast.json
          grep -q '"kernels":"neon"' fast.json
          cc -O2 -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror -DJB_SCALAR jb.c -lm -o jb-scalar
          ./jb-scalar --selftest | tee scalar.json
          grep -q '"kernels":"scalar"' scalar.json

      # The CUDA accelerator loads the driver and NVRTC at run time, so it
      # builds without CUDA installed; on these GPU-less runners the
      # selftest must fall back to the CPU kernels.
      - name: CUDA build without a GPU
        if: runner.os == 'Linux'
        run: |
          cc -O2 -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror -DJB_CUDA jb.c -lm -ldl -lpthread -o jb-cuda
          ./jb-cuda --selftest | tee cuda.json
          ! grep -q accelerator cuda.json
          cc -O2 -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror -ffast-math -DJB_CUDA jb.c -lm -ldl -lpthread -o jb-cuda-fast
          ./jb-cuda-fast --selftest | tee cuda-fast.json
          ! grep -q accelerator cuda-fast.json

      - name: Build and consume macOS library
        if: runner.os == 'macOS'
        run: |
          make clean
          make
          make install DESTDIR="$PWD/stage" PREFIX=/usr/local
          cc -O2 -std=c11 -I"$PWD/stage/usr/local/include" test/installed_consumer.c \
            "$PWD/stage/usr/local/lib/libjb.dylib" -lm -o installed-consumer
          DYLD_LIBRARY_PATH="$PWD/stage/usr/local/lib" ./installed-consumer

      - name: Build and test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /O2 /std:c11 /experimental:c11atomics /W4 /Fe:jb.exe jb.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\jb.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # MSVC implements OpenMP 2.0; keep the parallel loops in its form.
          cl /nologo /O2 /std:c11 /experimental:c11atomics /W4 /openmp /arch:AVX2 /Fe:jb-openmp.exe jb.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OMP_NUM_THREADS = "4"
          $out = .\jb-openmp.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out
          if ($out -notmatch '"kernels":"avx2"') { exit 1 }
          cl /nologo /O2 /std:c11 /experimental:c11atomics /W4 /LD /DJB_NO_MAIN /DJB_SHARED /DJB_BUILD_SHARED /Fe:jb.dll jb.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /O2 /std:c11 /experimental:c11atomics /W4 /DJB_SHARED /I. test/installed_consumer.c jb.lib /Fe:installed-consumer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\installed-consumer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Nothing reachable from an OpenMP parallel region may fail or allocate:
  # die() there exits the host from a worker thread, and allocations escape
  # the error frame's cleanup.
  parallel-regions:
    name: Source lint and invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          make lint

  # The README's Windows build. Errors unwind with longjmp, which MinGW's
  # default SEH setjmp crashed on at -O2, so exercise an error path directly.
  mingw:
    name: MinGW gcc -O2 (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build and test
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror jb.c -lm -o jb
          ./jb --selftest
          rc=0
          ./jb missing-model decide examples/request.json 2>err.txt || rc=$?
          cat err.txt
          test "$rc" -eq 2
          grep -q '^jb: open: ' err.txt

      - name: Library error path
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror -DJB_NO_MAIN -I. \
            examples/library.c jb.c -lm -o library
          rc=0
          ./library missing-model 2>err.txt || rc=$?
          cat err.txt
          test "$rc" -eq 1
          grep -q '^jev-bush: I/O error: open: ' err.txt

  # GitHub's x86 runners may lack AVX-512, so run those kernels under Intel's
  # Software Development Emulator, pinned by URL and checksum.
  avx512:
    name: AVX-512 kernels under SDE (${{ matrix.math }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - math: strict
            flags: ""
            kernels: avx512-exact
          - math: fast
            flags: "-ffast-math"
            kernels: avx512
    env:
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50

    steps:
      - uses: actions/checkout@v4

      - name: Install SDE
        run: |
          curl -sSfL -o sde.tar.xz "$SDE_URL"
          echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c -
          mkdir sde && tar -xJf sde.tar.xz -C sde --strip-components=1

      - name: Build
        run: |
          gcc -O2 -march=skylake-avx512 -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror ${{ matrix.flags }} \
            jb.c -lm -o jb-avx512

      # The selftest reports the kernels it tested; fail on a scalar fallback.
      - name: Selftest
        run: |
          sde/sde64 -skx -- ./jb-avx512 --selftest | tee selftest.json
          grep -q '"kernels":"${{ matrix.kernels }}"' selftest.json

  # GitHub's x86 runners have AVX2, so those kernels run natively. OpenMP
  # makes the kernels' parallel paths, including error reporting, run too.
  avx2:
    name: AVX2 kernels (${{ matrix.math }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - math: strict
            flags: ""
          - math: fast
            flags: "-ffast-math"

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          gcc -O2 -mavx2 -mfma -mno-avx512f -DJB_AVX2_ONLY -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror \
            ${{ matrix.flags }} -fopenmp jb.c -lm -o jb-avx2

      - name: Selftest
        run: |
          OMP_NUM_THREADS=4 ./jb-avx2 --selftest | tee selftest.json
          grep -q '"kernels":"avx2"' selftest.json

  sanitizers:
    name: ASan + UBSan (${{ matrix.math }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - math: strict
            flags: ""
          - math: fast
            flags: "-ffast-math"

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          clang -O1 -g -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror ${{ matrix.flags }} \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer jb.c -lm -o jb-asan

      - name: Selftest and valid request (leak-checked)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          ./jb-asan --selftest
          ./jb-asan --check-request examples/request.json

      # The CLI root frame releases tracked allocations on rejected requests.
      - name: Malformed requests (leak-checked)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: sh tools/check_requests.sh ./jb-asan

      # The library releases a failed call's allocations; check that
      # LeakSanitizer agrees on the example's error path.
      - name: Library error path (leak-checked)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          clang -O1 -g -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror ${{ matrix.flags }} \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -DJB_NO_MAIN -I. examples/library.c jb.c -lm \
            -o library-asan
          rc=0
          ./library-asan missing-model 2>err.txt || rc=$?
          cat err.txt
          test "$rc" -eq 1
          grep -q '^jev-bush: I/O error: open: ' err.txt
          ! grep -q Sanitizer err.txt

  fixture-manifest:
    name: Golden fixture manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify request fixture and shared-library ABI surface
        run: |
          echo '7eebd20b705f1f644adf6ee56148f753a46f8ceba75cc0f5a3e2d3c8951c76b0  examples/request.json' | sha256sum -c -
          cc -O2 -std=c11 -Wall -Wextra -pedantic -Werror -fPIC -shared -DJB_NO_MAIN -DJB_SHARED -DJB_BUILD_SHARED jb.c -lm -o libjb.so
          nm -D --defined-only libjb.so | grep -q ' jb_api_version$'
          cc -O2 -std=c11 -Wall -Wextra -pedantic -Werror -I. test/library_faults.c \
            -L. -Wl,-rpath,'$ORIGIN' -ljb -lm -o library-faults
          ./library-faults
          test "$(nm -D --defined-only libjb.so | awk '$2 ~ /^[TDBR]$/ {print $3}' | grep -vc '^jb_')" -eq 0

      - name: Install and consume the packaged library
        run: |
          make clean
          make CFLAGS='-O2 -std=c11 -Wall -Wextra -pedantic -Werror'
          make install DESTDIR="$PWD/stage" PREFIX=/usr
          PKG_CONFIG_PATH="$PWD/stage/usr/lib/pkgconfig" cc -O2 -std=c11 \
            test/installed_consumer.c $(PKG_CONFIG_PATH="$PWD/stage/usr/lib/pkgconfig" pkg-config --cflags --libs jev-bush) \
            -Wl,-rpath,"$PWD/stage/usr/lib" -o installed-consumer
          ./installed-consumer

      - name: Consume the static OpenMP package
        run: |
          make clean
          make OMPFLAGS=-fopenmp
          make install OMPFLAGS=-fopenmp DESTDIR="$PWD/stage-omp" PREFIX=/usr
          export PKG_CONFIG_PATH="$PWD/stage-omp/usr/lib/pkgconfig"
          pkg-config --libs --static jev-bush | grep -q -- '-fopenmp'
          cc -O2 -std=c11 test/installed_consumer.c "$PWD/stage-omp/usr/lib/libjb.a" \
            $(pkg-config --cflags --libs --static jev-bush) -o installed-static
          ./installed-static

  hardening:
    name: Hardened Linux build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build hardened binary
        run: |
          cc -O2 -std=c11 -Wall -Wextra -pedantic -Wshadow -Wformat=2 -Werror \
            -fstack-protector-strong -D_FORTIFY_SOURCE=3 -fPIE -pie \
            -Wl,-z,relro,-z,now,-z,noexecstack jb.c -lm -o jb-hardened
          ./jb-hardened --selftest

      - name: Verify ELF hardening
        run: |
          readelf -W -h jb-hardened | grep -q 'Type:.*DYN'
          readelf -W -l jb-hardened | grep 'GNU_STACK' | grep -q ' RW '
          readelf -W -l jb-hardened | grep -q 'GNU_RELRO'
          readelf -W -d jb-hardened | grep -q 'BIND_NOW'
          nm -u jb-hardened | grep -q '__stack_chk_fail'
          nm -u jb-hardened | grep -q '_chk@'
          make clean
          make libjb.so
          readelf -W -l libjb.so | grep 'GNU_STACK' | grep -q ' RW '
          readelf -W -l libjb.so | grep -q 'GNU_RELRO'
          readelf -W -d libjb.so | grep -q 'BIND_NOW'
          nm -u libjb.so | grep -q '__stack_chk_fail'

  fuzz:
    name: Fuzz input readers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            fuzz/fuzz_json.c -lm -o fuzz_json
          clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            fuzz/fuzz_safetensors.c -lm -o fuzz_safetensors

      # New inputs go to the first (scratch) directory; the checked-in seeds
      # stay read-only.
      - name: Fuzz JSON
        run: |
          mkdir -p corpus artifacts
          ./fuzz_json -max_total_time=120 -max_len=1048576 -dict=fuzz/json.dict \
            -artifact_prefix=artifacts/ corpus fuzz/corpus

      - name: Fuzz safetensors metadata
        run: |
          mkdir -p safetensors-corpus
          ./fuzz_safetensors -max_total_time=120 -max_len=1048576 -dict=fuzz/json.dict \
            -artifact_prefix=artifacts/ safetensors-corpus

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: artifacts/
